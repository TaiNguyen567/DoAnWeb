<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Đăng nhập')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="container" style="max-width: 420px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: #667eea;">
            <i class="bi bi-check2-circle me-2"></i>Habit Tracker
        </h2>
        <p class="text-muted">Xây dựng thói quen tốt mỗi ngày</p>
    </div>

    <div class="card p-4">
        <h4 class="fw-bold mb-3 text-center">Đăng nhập</h4>

        <!-- Thông báo thành công sau khi đăng ký -->
        <div th:if="${param.registered}" class="alert alert-success">
            <i class="bi bi-check-circle me-1"></i>Đăng ký thành công! Hãy đăng nhập.
        </div>

        <!-- Thông báo đăng xuất -->
        <div th:if="${param.logout}" class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i>Bạn đã đăng xuất.
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${param.error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-1"></i>Sai tên đăng nhập hoặc mật khẩu.
        </div>

        <form action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username" required/>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required/>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
            </button>
        </form>

        <hr/>
        <p class="text-center mb-0 text-muted">
            Chưa có tài khoản?
            <a href="/register" class="fw-semibold" style="color: #667eea;">Đăng ký ngay</a>
        </p>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
