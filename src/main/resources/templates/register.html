<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Đăng ký')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: #667eea;">
            <i class="bi bi-check2-circle me-2"></i>Habit Tracker
        </h2>
        <p class="text-muted">Tạo tài khoản miễn phí</p>
    </div>

    <div class="card p-4">
        <h4 class="fw-bold mb-3 text-center">Đăng ký</h4>

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span th:text="${error}"></span>
        </div>

        <form action="/register" method="post" th:object="${registerDTO}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" th:field="*{username}"
                           class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           placeholder="4-50 ký tự"/>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" th:field="*{email}"
                           class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="example@gmail.com"/>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" th:field="*{password}"
                           class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           placeholder="Ít nhất 6 ký tự"/>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-person-plus me-1"></i>Tạo tài khoản
            </button>
        </form>

        <hr/>
        <p class="text-center mb-0 text-muted">
            Đã có tài khoản?
            <a href="/login" class="fw-semibold" style="color: #667eea;">Đăng nhập</a>
        </p>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
